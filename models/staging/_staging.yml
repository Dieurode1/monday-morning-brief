# Descriptions and tests for the staging models.
# Tests check that IDs are present and unique, that orders, products, and refunds link up,
# and that ad spend only comes from Meta or Google.
version: 2

models:
  - name: stg_products
    description: One row per product.
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_orders
    description: One row per order.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: ordered_at
        tests: [not_null]

  - name: stg_order_lines
    description: One row per product on an order.
    columns:
      - name: order_line_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: stg_refunds
    description: One row per refunded order line.
    columns:
      - name: refund_id
        tests: [unique, not_null]
      - name: order_line_id
        tests:
          - unique
          - relationships:
              arguments:
                to: ref('stg_order_lines')
                field: order_line_id

  - name: stg_inventory_daily
    description: One row per product per day, showing units on hand.
    columns:
      - name: snapshot_date
        tests: [not_null]
      - name: on_hand_units
        tests: [not_null]

  - name: stg_ad_spend_daily
    description: One row per ad platform per day.
    columns:
      - name: platform
        tests:
          - accepted_values:
              arguments:
                values: ['meta', 'google']
