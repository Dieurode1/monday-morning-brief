# dbt project settings: names the project, points to the Snowflake connection profile,
# and sends staging models to views in STAGING and the mart to a table in MARTS.
name: monday_morning_brief
version: "1.0.0"
profile: monday_morning_brief

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  monday_morning_brief:
    staging:
      +schema: STAGING
      +materialized: view
    marts:
      +schema: MARTS
      +materialized: table
