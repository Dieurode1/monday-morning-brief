# Declares the raw tables loaded by snowflake/load_raw.py so staging models can use them.
# Every column in these tables is text; the staging models convert them to proper types.
version: 2

sources:
  - name: raw
    database: MMB
    schema: RAW
    description: Sample CSV files loaded as text by snowflake/load_raw.py
    tables:
      - name: products
      - name: orders
      - name: order_lines
      - name: refunds
      - name: inventory_daily
      - name: ad_spend_daily
      - name: supplier_lead_times
